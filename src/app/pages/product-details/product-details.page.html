<div class="space-y-8">
  <div>
    <a
      routerLink="/"
      class="inline-block border-l-2 border-zinc-800 hover:border-cyan-400 pl-3 py-1 text-xs font-medium text-zinc-400 hover:text-white transition"
    >
      ← Powrót do katalogu
    </a>
  </div>

  @if (isLoading()) {
    <div class="h-36 border-l-2 border-zinc-800 pl-5 animate-pulse cursor-default"></div>
  } @else if (errorMsg()) {
    <div class="border-l-2 border-rose-400 pl-5 py-2 space-y-3 cursor-default">
      <p class="text-sm text-rose-300">{{ errorMsg() }}</p>
      <a
        routerLink="/"
        class="inline-block text-xs font-semibold text-cyan-400 hover:text-cyan-300"
      >
        Wróć do katalogu →
      </a>
    </div>
  } @else if (product(); as item) {
    <div class="border-l-2 border-cyan-400 pl-6 py-2 space-y-6 max-w-2xl cursor-default">
      <div class="space-y-2">
        <p class="text-[11px] uppercase tracking-widest text-cyan-400 font-medium">
          {{ item.categoryName }}
        </p>
        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">
          {{ item.name }}
        </h1>
      </div>

      <p class="text-sm text-zinc-300 leading-relaxed border-b border-zinc-900 pb-6">
        {{ item.description }}
      </p>

      <div class="flex flex-wrap items-center justify-between gap-6 pt-1">
        <div>
          <p class="text-[11px] uppercase tracking-wider text-zinc-500">Cena</p>
          <p class="text-xl font-semibold text-white mt-0.5">
            {{ item.price | pln }}
          </p>
        </div>

        <button
          type="button"
          (click)="addToCart()"
          class="py-2.5 px-5 bg-cyan-400 hover:bg-cyan-300 text-zinc-950 text-xs font-semibold uppercase tracking-wider transition cursor-pointer"
        >
          Dodaj do koszyka
        </button>
      </div>
    </div>
  }
</div>
